<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KhataX Razorpay Test</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

  <h2>KhataX Razorpay Test Payment</h2>

  <p>Invoice: INV-00002</p>
  <p>Amount: ₹1,000</p>

  <button id="payButton">
    Pay ₹1,000
  </button>

  <script>
    const options = {
      key: "rzp_test_SKNKtXDYr5TXzq",

      amount: 100000,

      currency: "INR",

      name: "KhataX",

      description: "Test payment for INV-00002",

      order_id: "order_ThRiZy641Ise5u",

      prefill: {
        name: "Razorpay Test Customer",
        email: "razorpay.test@khatax.com",
        contact: "9876543210"
      },

      theme: {
        color: "#3399cc"
      },

      handler: function (response) {
        console.log("Razorpay payment response:");
        console.log(response);

        alert(
          "Payment completed!\n\n" +
          "Payment ID: " +
          response.razorpay_payment_id
        );
      },

      modal: {
        ondismiss: function () {
          console.log("Razorpay Checkout closed");
        }
      }
    };

    document
      .getElementById("payButton")
      .addEventListener("click", function () {

        const razorpay =
          new Razorpay(options);

        razorpay.open();
      });
  </script>

</body>
</html>
